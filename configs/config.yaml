data:
  exp: 'exp12'
  model_name: 'MPI-ESM1-2-LR'
  raw_path: 'MPI-ESM1-2-LR/r1-r50i1p1f1/'
  dataset_path: 'MPI-ESM1-2-LR/annual/'
  seed_subsets: 42
  nb_member_per_subsets: 30 # one-to-many approach. If n = 1, individual approach. TODO : remove
  one_to_many: True
  nb_subsets: 1  # only if one-to-many is True TODO : remove
  piControl_diff: True
  add_clim_to_predictors: True
  predict_only_last_timestep: True
  timescale: 'annual'
  seq_length: 10
  moving_window: 1
  smoothed_outputs: False # !!!


train: # for training
  val_size: 0.2 # in case simus_val is None
  seed: 42
  arch: 'attention-unet'
  learning_rate: 0.0001
  max_epochs: 100
  batch_size: 16
  runs_dir: 'MPI-ESM1-2-LR/annual/exp12/'
  inputs: ['CO2', 'SO2', 'CH4', 'BC', 'tau']
  outputs: ['tas'] # carefull seq_length
  simus_train: ['historical', 'hist-nat', 'hist-GHG', 'ssp119', 'ssp126', 'ssp585']
  simus_val: ['ssp370']
  simus_test: ['ssp245']
  simus_inference: ['ssp245']
  img_size: [96, 192]
  scheduler_step_size: 50
  scheduler_gamma: 0.1
  lstm_units: 64
  monitor_metric: 'val_nrmse' # for best checkpointing and hyperparameter optimization
  alpha: 5
  early_stopping: 20
  encoder: 'vgg11'
  unet_features: 64
  links: 5
  climax:
    pretrained_path: "https://huggingface.co/tungnd/climax/resolve/main/5.625deg.ckpt"   # "" pour partir de zéro
    patch_size: 16
    embed_dim: 1024
    depth: 8
    decoder_depth: 2
    num_heads: 16
    mlp_ratio: 4.0
    drop_path: 0.1
    drop_rate: 0.1
    parallel_patch_embed: false
    freeze_encoder: false
    warmup_epochs: 5
