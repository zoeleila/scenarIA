tas:
  shortname: tas
  longname: Temperature
  unit: K
  lim:
    values: [0, 12] # if climatology
    rmse: [0., 1.1]
    mae: [0., 1.5]
    temporal_correlation: [-1, 1]
    mean_error: [-0.9, 0.9] # error at grid point then mean
    error: [-0.9, 0.9] # mean then error at grid point
    relative_changes: [0., 4.5]
    relative_error: [-0.5, 0.5]
    std: [0., 0.5]
  color: 'red'
  cmap:
    values: 'YlOrRd'
    rmse: 'Reds'
    mae: 'viridis'
    temporal_correlation: 'coolwarm'
    mean_error: 'coolwarm'
    error: 'coolwarm'
    relative_changes: 'Reds'
    relative_error: 'coolwarm'
    std: 'Reds'
    

pr:
  shortname: pr
  longname: Precipitation
  unit: mm/day
  lim:
    values: [-2, 2] 
    rmse: [0., 0.8]
    mae: [0, 2.5]
    temporal_correlation: [-1, 1]
    mean_error: [-0.6, 0.6]
    error: [-0.6, 0.6]
    relative_error: [-0.6, 0.6]
    std: [0., 0.3]
  color: 'c'
  cmap:
    values: 'BrBG'
    rmse: 'Reds'
    mae: 'viridis'
    temporal_correlation: 'coolwarm'
    mean_error: 'coolwarm'
    error: 'coolwarm'
    relative_error: 'coolwarm'
    std: 'Reds'


